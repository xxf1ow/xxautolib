name: Representative releases

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated native platforms
        type: string
        default: windows-x86_64,linux-x86_64,linux-aarch64
        required: true
      modules:
        description: Comma-separated representative modules
        type: string
        default: queue,lz4,flann
        required: true
      force:
        description: Rebuild the selected dependency closure
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-autolib-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}
      linux_image: ${{ steps.plan.outputs.linux_image }}
    steps:
      - name: Require default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "CI requires the repository default branch." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan selected work
        id: plan
        shell: bash
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms }}
          SELECTED_MODULES: ${{ inputs.modules }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-input build/tools
          cmake -P src/autolib-builder/go-sdk.cmake -- build -mod=readonly -trimpath -o build/tools/autolib-builder ./src/autolib-builder
          cmake -P src/autolib-builder/go-sdk.cmake -- build -mod=readonly -trimpath -o build/tools/autolib-ci ./src/autolib-ci
          build/tools/autolib-ci plan --source-root "$GITHUB_WORKSPACE" --builder-file "$GITHUB_WORKSPACE/build/tools/autolib-builder" --output build/ci-input/plan.json --platforms "$SELECTED_PLATFORMS" --modules "$SELECTED_MODULES" --force="$FORCE"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg checkout "$(git rev-parse HEAD)" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{repository:$repository,ref:$ref,sha:$sha,checkout_sha:$checkout,run_id:$run,attempt:$attempt}' > build/ci-input/run.json
          jq -cr '"windows=" + (any(.platforms[]; .id == "windows-x86_64")|tostring), "linux=" + (any(.platforms[]; .id|startswith("linux-"))|tostring), "linux_matrix=" + ({include:[.platforms[] | select(.id|startswith("linux-")) | {platform:.id,runner:({"linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm"}[.id])}]}|tojson)' build/ci-input/plan.json >> "$GITHUB_OUTPUT"
          echo "linux_image=$(jq -er '.ubuntu.image' .github/ci-tools.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-input/*.json
          if-no-files-found: error

  initialize:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-input
      - name: Build CI tool
        run: cmake -P src/autolib-builder/go-sdk.cmake -- build -mod=readonly -trimpath -o build/tools/autolib-ci ./src/autolib-ci
      - name: Initialize fixed Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: build/tools/autolib-ci init --source-root "$GITHUB_WORKSPACE" --run-identity build/ci-input/run.json

  linux:
    needs: [plan, initialize]
    if: ${{ needs.plan.outputs.linux == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    container:
      image: ${{ needs.plan.outputs.linux_image }}
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      WORK_ROOT: ${{ github.workspace }}/build/ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.platform }}
    steps:
      - name: Bootstrap container
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-input
      - name: Prepare native environment and tools
        id: environment
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-linux.sh --config .github/ci-tools.json --plan build/ci-input/plan.json --platform "$PLATFORM" --work-root "$WORK_ROOT" > build/ci-input/environment.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' build/ci-input/environment.json >> "$GITHUB_OUTPUT"
          jq -r --arg platform "$PLATFORM" '.platforms[] | select(.id == $platform) | "layer0=" + (((.layers[0] // [])|length)>0|tostring), "layer1=" + (((.layers[1] // [])|length)>0|tostring)' build/ci-input/plan.json >> "$GITHUB_OUTPUT"
      - name: Prepare platform
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
          MAKE_PROGRAM: ${{ steps.environment.outputs.make_program }}
          BUDGET: ${{ steps.environment.outputs.budget }}
        run: >-
          "$WORK_ROOT/autolib-ci" run --source-root "$GITHUB_WORKSPACE" --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform "$PLATFORM" --layer prepare --work-root "$WORK_ROOT" --builder-file "$WORK_ROOT/autolib-builder" --importer-file "$WORK_ROOT/autolib-importer" --cmake-command "$CMAKE_COMMAND" --make-program "$MAKE_PROGRAM" --budget "$BUDGET"
      - name: Produce dependency layer 0
        if: ${{ steps.environment.outputs.layer0 == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
          MAKE_PROGRAM: ${{ steps.environment.outputs.make_program }}
          BUDGET: ${{ steps.environment.outputs.budget }}
        run: >-
          "$WORK_ROOT/autolib-ci" run --source-root "$GITHUB_WORKSPACE" --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform "$PLATFORM" --layer layer0 --work-root "$WORK_ROOT" --builder-file "$WORK_ROOT/autolib-builder" --importer-file "$WORK_ROOT/autolib-importer" --cmake-command "$CMAKE_COMMAND" --make-program "$MAKE_PROGRAM" --budget "$BUDGET"
      - name: Produce dependency layer 1
        if: ${{ steps.environment.outputs.layer1 == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
          MAKE_PROGRAM: ${{ steps.environment.outputs.make_program }}
          BUDGET: ${{ steps.environment.outputs.budget }}
        run: >-
          "$WORK_ROOT/autolib-ci" run --source-root "$GITHUB_WORKSPACE" --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform "$PLATFORM" --layer layer1 --work-root "$WORK_ROOT" --builder-file "$WORK_ROOT/autolib-builder" --importer-file "$WORK_ROOT/autolib-importer" --cmake-command "$CMAKE_COMMAND" --make-program "$MAKE_PROGRAM" --budget "$BUDGET"
      - name: Verify selected work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
          MAKE_PROGRAM: ${{ steps.environment.outputs.make_program }}
          BUDGET: ${{ steps.environment.outputs.budget }}
        run: >-
          "$WORK_ROOT/autolib-ci" run --source-root "$GITHUB_WORKSPACE" --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform "$PLATFORM" --layer verify --work-root "$WORK_ROOT" --builder-file "$WORK_ROOT/autolib-builder" --importer-file "$WORK_ROOT/autolib-importer" --cmake-command "$CMAKE_COMMAND" --make-program "$MAKE_PROGRAM" --budget "$BUDGET"
      - name: Retain platform result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ env.WORK_ROOT }}/results/*.json
          if-no-files-found: warn
      - name: Retain diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: |
            ${{ env.WORK_ROOT }}/logs/
            ${{ env.WORK_ROOT }}/evidence/**/*.json
            ${{ env.WORK_ROOT }}/evidence/**/*.log
            ${{ env.WORK_ROOT }}/jobserver.json
          if-no-files-found: warn

  windows:
    needs: [plan, initialize]
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      WORK_ROOT: ${{ github.workspace }}/build/ci/${{ github.run_id }}-${{ github.run_attempt }}/windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-input
      - name: Prepare native environment and tools
        id: environment
        run: |
          $settings = ./.github/scripts/prepare-windows.ps1 -Config .github/ci-tools.json -Plan build/ci-input/plan.json -Platform windows-x86_64 -WorkRoot $env:WORK_ROOT | ConvertFrom-Json
          "cmake_command=$($settings.cmake_command)" >> $env:GITHUB_OUTPUT
          $plan = Get-Content build/ci-input/plan.json -Raw | ConvertFrom-Json
          $platform = @($plan.platforms | Where-Object id -eq 'windows-x86_64')[0]
          "layer0=$($platform.layers.Count -gt 0 -and @($platform.layers[0]).Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "layer1=$($platform.layers.Count -gt 1 -and @($platform.layers[1]).Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Prepare platform
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
        run: >-
          & "$env:WORK_ROOT/autolib-ci.exe" run --source-root $env:GITHUB_WORKSPACE --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform windows-x86_64 --layer prepare --work-root $env:WORK_ROOT --builder-file "$env:WORK_ROOT/autolib-builder.exe" --importer-file "$env:WORK_ROOT/autolib-importer.exe" --cmake-command $env:CMAKE_COMMAND
      - name: Produce dependency layer 0
        if: ${{ steps.environment.outputs.layer0 == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
        run: >-
          & "$env:WORK_ROOT/autolib-ci.exe" run --source-root $env:GITHUB_WORKSPACE --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform windows-x86_64 --layer layer0 --work-root $env:WORK_ROOT --builder-file "$env:WORK_ROOT/autolib-builder.exe" --importer-file "$env:WORK_ROOT/autolib-importer.exe" --cmake-command $env:CMAKE_COMMAND
      - name: Produce dependency layer 1
        if: ${{ steps.environment.outputs.layer1 == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
        run: >-
          & "$env:WORK_ROOT/autolib-ci.exe" run --source-root $env:GITHUB_WORKSPACE --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform windows-x86_64 --layer layer1 --work-root $env:WORK_ROOT --builder-file "$env:WORK_ROOT/autolib-builder.exe" --importer-file "$env:WORK_ROOT/autolib-importer.exe" --cmake-command $env:CMAKE_COMMAND
      - name: Verify selected work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_COMMAND: ${{ steps.environment.outputs.cmake_command }}
        run: >-
          & "$env:WORK_ROOT/autolib-ci.exe" run --source-root $env:GITHUB_WORKSPACE --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --platform windows-x86_64 --layer verify --work-root $env:WORK_ROOT --builder-file "$env:WORK_ROOT/autolib-builder.exe" --importer-file "$env:WORK_ROOT/autolib-importer.exe" --cmake-command $env:CMAKE_COMMAND
      - name: Retain platform result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64
          path: ${{ env.WORK_ROOT }}/results/*.json
          if-no-files-found: warn
      - name: Retain diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64
          path: |
            ${{ env.WORK_ROOT }}/logs/
            ${{ env.WORK_ROOT }}/evidence/**/*.json
            ${{ env.WORK_ROOT }}/evidence/**/*.log
          if-no-files-found: warn

  finalize:
    needs: [plan, initialize, linux, windows]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-input
      - name: Collect available results
        uses: actions/download-artifact@v8
        with:
          pattern: ci-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: build/ci-results
          merge-multiple: true
      - name: Build CI tool
        run: cmake -P src/autolib-builder/go-sdk.cmake -- build -mod=readonly -trimpath -o build/tools/autolib-ci ./src/autolib-ci
      - name: Summarize selected work
        run: build/tools/autolib-ci finalize --plan build/ci-input/plan.json --run-identity build/ci-input/run.json --results build/ci-results
