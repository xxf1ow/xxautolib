name: Gitee Release synchronization

on:
  workflow_run:
    workflows: [Representative releases]
    types: [completed]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names (blank checks all assets)
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: gitee-release-sync-${{ vars.GITEE_REPOSITORY || 'xxf1ow/autolib-release' }}-${{ vars.GITEE_RELEASE_TAG || 'autolib-release' }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require branch ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/?* ]]; then
            echo "Gitee synchronization requires a trusted branch ref." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install sync dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv build/tools/gitee-sync-venv
          build/tools/gitee-sync-venv/bin/python -m pip install -r .github/actions/gitee-release/requirements.txt -c .github/actions/gitee-release/constraints.txt
          echo "$GITHUB_WORKSPACE/build/tools/gitee-sync-venv/bin" >> "$GITHUB_PATH"
      - name: Synchronize Release
        uses: ./.github/actions/gitee-release
        with:
          packages: ${{ inputs.packages }}
          repository: ${{ vars.GITEE_REPOSITORY || 'xxf1ow/autolib-release' }}
          tag: ${{ vars.GITEE_RELEASE_TAG || 'autolib-release' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
