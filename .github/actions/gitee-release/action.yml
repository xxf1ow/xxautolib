name: Gitee artifact publication
description: Publish declared local assets and metadata to Gitee
inputs:
  host:
    description: Publication host (gitee only)
    required: true
  mode:
    description: artifacts or latest
    required: true
  input:
    description: Local publication.json for artifacts mode
    default: ''
  latest:
    description: Explicit JSON latest mapping for latest-only mode
    default: ''
  repository:
    description: Target Gitee owner/repository
    required: true
  tag:
    description: Target Gitee Release tag
    required: true
runs:
  using: composite
  steps:
    - name: Publish local input
      shell: bash
      env:
        PUBLISH_HOST: ${{ inputs.host }}
        PUBLISH_MODE: ${{ inputs.mode }}
        PUBLISH_INPUT: ${{ inputs.input }}
        PUBLISH_LATEST: ${{ inputs.latest }}
        GITEE_REPOSITORY: ${{ inputs.repository }}
        GITEE_RELEASE_TAG: ${{ inputs.tag }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python "${{ github.action_path }}/publish.py"
