# FFmpeg：从固定源码构建 OpenCV 和 gst-libav 所用的共享开发库。
type = "cmake"
package_platforms = ["windows-x86_64", "linux-x86_64", "linux-aarch64", "darwin-aarch64"]
package_name = "FFMPEG"
config_dir = "lib/cmake/FFMPEG"
pkgconfig_dir = "lib/pkgconfig"
sentinel = "lib/cmake/FFMPEG/FFMPEGConfig.cmake"

[source]
URL = ["https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"]
URL_HASH = "SHA256=7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
DOWNLOAD_NAME = "ffmpeg-8.1.3.tar.xz"

# Ubuntu 20.04 的 NASM 2.14.02 无法汇编 libswscale 的 x86 实现。
[platforms.linux-x86_64.resources.nasm]
URL = ["https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz"]
URL_HASH = "SHA256=1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148"
DOWNLOAD_NAME = "nasm-2.16.03.tar.xz"

[platforms.linux-x86_64.cmake.cache]
FFMPEG_NASM_SOURCE = "<RESOURCE_SOURCE_DIR:nasm>"

[platforms.windows-x86_64.resources.nasm]
URL = ["https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"]
URL_HASH = "SHA256=3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
DOWNLOAD_NAME = "nasm-2.16.03-win64.zip"

[platforms.windows-x86_64.cmake.cache]
FFMPEG_NASM_SOURCE = "<RESOURCE_SOURCE_DIR:nasm>"

[[steps]]
name = "prepare-ffmpeg-build"
DEPENDEES = ["patch"]
DEPENDERS = ["configure"]
WORKING_DIRECTORY = "."
DEPENDS = ["CMakeLists.txt", "install-ffmpeg.cmake.in", "FFMPEGConfig.cmake"]
COMMAND = [["cmake", "-E", "copy_if_different", "CMakeLists.txt", "install-ffmpeg.cmake.in", "FFMPEGConfig.cmake", "<SOURCE_DIR>"]]
