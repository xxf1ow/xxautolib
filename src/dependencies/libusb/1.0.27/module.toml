# libusb：跨平台 USB 访问库，使用上游 CMake 包装构建并安装静态库。
name = "libusb"
type = "cmake"
version = "1.0.27"
sentinel = "include/libusb-1.0/libusb.h"

[source]
GIT_REPOSITORY = "https://github.com/libusb/libusb-cmake.git"
GIT_TAG = "cec1e49eec481a6333c218726ecaba8e4f447a07" # 固定 SDK 使用的 v1.0.27-1，源码随包装仓库提供。

[cmake.cache]
LIBUSB_BUILD_SHARED_LIBS = false # 静态链接进 SDK；Linux 保留默认 udev 后端，需系统 libudev-dev。

[system_dependencies]
apt = ["libudev-dev"]
