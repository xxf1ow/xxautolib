# lz4：高速无损压缩库，构建并安装静态库。
name = "lz4"
type = "cmake"
version = "1.10.0"
sentinel = "include/lz4.h"
config_dir = "lib/cmake/lz4"
pkgconfig_dir = "lib/pkgconfig"

[source]
GIT_REPOSITORY = "https://github.com/lz4/lz4.git"
GIT_TAG = "ebb370ca83af193212df4dcbadcc5d87bc0de2f0" # 固定 v1.10.0；升级时核对 CMake 子目录和静态安装布局。

[cmake]
SOURCE_SUBDIR = "build/cmake" # lz4 的 CMakeLists.txt 位于源码的 build/cmake 子目录。

[cmake.cache]
BUILD_SHARED_LIBS = false     # 禁用动态库。
BUILD_STATIC_LIBS = true      # 启用静态库。
LZ4_BUILD_CLI = false         # 禁用命令行压缩、解压工具。
LZ4_BUILD_LEGACY_LZ4C = false # 禁用旧版 lz4c 命令行工具。
