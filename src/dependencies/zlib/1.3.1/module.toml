# zlib：通用无损压缩库，只编译和安装静态库。
type = "cmake"
package_platforms = ['windows-x86_64','linux-x86_64','linux-aarch64','darwin-aarch64']
sentinel = "include/zlib.h"
pkgconfig_dir = "share/pkgconfig"

[source]
GIT_REPOSITORY = "https://github.com/madler/zlib.git"
GIT_TAG = "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf" # 固定 v1.3.1 对应提交；升级时须检查静态专用补丁。

[cmake.cache]
ZLIB_BUILD_EXAMPLES = false # 只构建库，不构建上游示例程序。

[[patches]]
file = "zlib-v1.3.1-static-only.patch" # 移除动态库目标及其安装规则，不能仅依靠 BUILD_SHARED_LIBS=OFF。

[[patches]]
file = "static-pkgconfig.patch" # .pc 必须引用实际静态库名：Windows 为 zlibstatic，其余平台为 z。
