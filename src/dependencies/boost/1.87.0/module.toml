# boost：Boost C++ 库集合，安装静态库并使用独立 zlib 模块。
name = "boost"
type = "cmake"
version = "1.87.0"
supported_platforms = ['windows-x86_64','linux-x86_64','linux-aarch64']
depends = ["zlib"]
sentinel = "lib/cmake/Boost-1.87.0/BoostConfig.cmake"
config_dir = "lib/cmake/Boost-1.87.0"
package_name = "Boost"

[source] # 固定迁移基线；升级时同步核对布局及导出接口。
URL = ["https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-cmake.tar.xz"]
URL_HASH = "SHA256=7da75f171837577a52bbf217e17f8ea576c7c246e4594d617bfde7fafd408be5"
DOWNLOAD_NAME = "boost-1.87.0-cmake.tar.xz"

[cmake.cache] # 保留全部参考模块、静态构建及 iostreams 的 zlib 支持。
BUILD_SHARED_LIBS = false
BOOST_IOSTREAMS_ENABLE_ZLIB = true
BOOST_EXCLUDE_LIBRARIES = ""
